schema: spec-driven

# 项目上下文
context: |
  项目是 Unity 2022.3.62f3c1 游戏项目，使用 URP 2D Renderer。
  当前阶段只搭建可扩展的游戏架构骨架，不实现完整 Demo 玩法、正式关卡、最终 UI、音频资源或剧情内容。

  代码统一放在 Assets/Scripts 下，并按 Architecture 与 Features 分层。
  Architecture 下使用 Domain、Application、Adapters、Composition 和 Contracts 目录；测试放在 Assets/Tests 下。
  使用 asmdef 保护程序集边界，目标程序集包括 Spotlight.Domain、Spotlight.Application、Spotlight.Adapters、Spotlight.Features.*、Spotlight.Tests.EditMode 和 Spotlight.Tests.PlayMode。

  依赖方向固定为：Adapters → Application → Domain；Features 只依赖 Contracts、Domain 和 Application，不依赖其他 Feature 的具体实现。
  Domain 不依赖 Unity 场景对象、MonoBehaviour、UI、AudioSource、SceneManager 或具体存档实现。
  Application 不依赖具体 Unity 适配器。
  SessionRoot 是唯一组合根，负责创建和组装全局服务；禁止使用跨模块业务静态单例和 Service Locator。

  场景、存档、音频、输入、对话和 Demo 流程优先通过接口与纯数据契约表达。
  本阶段的最小适配器可以是内存、空实现或记录型实现，但必须返回明确结果，不得使用假成功、空方法或静默降级掩盖未实现行为。
  通讯系统只实现同步、进程内、强类型事件总线；EventBus 只负责发布、订阅和解除订阅，不承载业务逻辑。
  当前使用 SampleScene 作为临时启动和架构烟测目标，不创建正式 Bootstrap、Menu、Hub 或 Demo 场景。

  OpenSpec 文档使用中文；代码标识符、稳定 ID、程序集名称和命令名称使用英文。
  公共接口、公共类型、公开序列化字段和复杂规则需要中文 XML 文档或原因注释。
  验证必须针对实际改动执行；Unity Editor、场景、UI、输入、音频、物理和 PlayMode 未实际验证时，必须标记 Editor 验证未完成。

# 每类 artifact 的额外规则
rules:
  proposal:
    - 使用中文编写。
    - 明确背景、目标、范围、非目标、主要架构决策和风险。
    - 不把完整玩法或未来扩展内容伪装成本次架构骨架的交付范围。
  spec:
    - 使用中文编写。
    - 描述可观察行为、接口契约、数据约束、失败结果和边界条件。
    - 使用 MUST、SHOULD 等要求时，必须对应明确的验收方式。
  plan:
    - 使用中文编写。
    - 写明 Assets/Scripts 下的目录、程序集、实现顺序、依赖和验证路径。
    - 优先采用纯 C# 契约、最小适配器和组合根注入。
  tasks:
    - 使用中文编写。
    - 每项任务必须是可执行且可验证的独立步骤。
    - tasks.md 是代码实现阶段的唯一细粒度任务来源，并同步为执行 Todo。

# 操作指导
operations:
  apply:
    guidance:
      - 用户确认 OpenSpec 文档前不得开始代码、场景、资源或配置实现。
      - 按 tasks.md 顺序执行；每完成一项就更新任务状态并运行对应验证。
  archive:
    guidance:
      - 归档前确认 proposal、spec、plan、tasks、代码、测试和 GitHub Issue 范围一致。
      - 未完成或未实际验证的任务不得标记完成。
